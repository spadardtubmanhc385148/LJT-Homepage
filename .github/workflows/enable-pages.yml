name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages to build the homepage from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/pages" -X PUT \
              -f "source[branch]=master" \
              -f "source[path]=/"
          else
            gh api "repos/${{ github.repository }}/pages" -X POST \
              -f "source[branch]=master" \
              -f "source[path]=/"
          fi
